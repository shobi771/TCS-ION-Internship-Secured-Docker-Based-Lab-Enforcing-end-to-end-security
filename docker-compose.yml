version: '3.8'

networks:
  labnet:
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

services:
  webserver:
    build: ./webserver
    container_name: webserver
    networks:
      labnet:
        ipv4_address: 172.20.0.10
    ports:
      - "80:80"

  python_app:
    build: ./python
    container_name: python_app
    networks:
      labnet:
        ipv4_address: 172.20.0.20
    ports:
      - "5000:5000"

  java_app:
    build: ./java
    container_name: java_app
    networks:
      labnet:
        ipv4_address: 172.20.0.30
    ports:
      - "8080:8080"

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    networks:
      labnet:
        ipv4_address: 172.20.0.40
    ports:
      - "1234:3306"
